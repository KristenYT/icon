name: Icon Image Workflow

on:
  push:
    branches:
      - main
    paths:
      - 'Badges/**'
      - 'Emby/**'
      - 'Other/**'
      - 'Rex/**'
      - 'Surge/**'
      - 'VideoPlayer/**'
  pull_request:
    branches:
      - main
    paths:
      - 'Badges/**'
      - 'Emby/**'
      - 'Other/**'
      - 'Rex/**'
      - 'Surge/**'
      - 'VideoPlayer/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-icon-json
  cancel-in-progress: false

jobs:
  update-icon-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate icon.json
        run: python .github/scripts/generate_image_json.py

      - name: Upload icon.json artifact
        uses: actions/upload-artifact@v4
        with:
          name: icon-json
          path: icon.json

      - name: Commit icon.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add icon.json
          git diff --cached --quiet || git commit -m "自動更新圖標集"
          git push